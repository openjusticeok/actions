name: 'Tofu Plan & Apply for GCP'
#  - pull_request: runs `tofu plan` and posts the result as a PR comment;
#    init/plan failures are reported with a generic "check the workflow logs" note
#  - -detailed-exitcode + fail-closed guard: red on a real error (1), green on
#    no-changes (0) and changes-pending (2); the comment distinguishes all three
#  - one comment posted per push
#  - concurrency lock on state, timeout, -input=false, TF_IN_AUTOMATION
#  - allow_apply opt-in (default false) + default-branch gate on apply

on:
  workflow_call:
    inputs:
      gcp_project_id:
        description: 'The GCP project ID.'
        required: true
        type: string
      gcp_wif_provider:
        description: 'The full resource name of the WIF provider for Github Actions.'
        required: true
        type: string
      gcp_service_account:
        description: 'The service account email for the Github Actions workflow to use.'
        required: true
        type: string
      tofu_version:
        description: 'OpenTofu version to use.'
        required: false
        type: string
        default: '1.8.1'
      gcp_state_bucket_name:
        description: 'The name of the GCS bucket for Tofu state.'
        required: true
        type: string
      gcp_state_prefix:
        description: 'Optional prefix (folder) in the GCS bucket for Tofu state.'
        required: false
        type: string
        default: ''
      working_directory:
        description: 'The directory where the Tofu commands will be run.'
        required: true
        type: string
      tfvars_file:
        description: 'Optional name of the .tfvars file to use.'
        required: false
        type: string
        default: ''
      allow_apply:
        description: 'Set to true to allow the apply step to run on push/dispatch events from the default branch.'
        required: false   # github does not 'enforce' required on workflow_call inputs (T_T)
        type: boolean     #   so an unset boolean reads as false...
        default: false    #   apply is opt-in... blank means no deploys

jobs:
  tofu:
    name: 'Tofu Plan & Apply'
    runs-on: ubuntu-latest

    # cap runaway runs (github's default is 6 hours).... a crashed run holding the
    #   gcs state lock would otherwise dam the queue; recovery for a stuck lock is
    #   running `tofu force-unlock <lock-id>`
    timeout-minutes: 30

    # tf_in_automation softens cli hints that assume an interactive operator
    env:
      TF_IN_AUTOMATION: 'true'

    # serialize runs that touch the same state (working dir + ref) so a plan and
    #   an apply never race the same opentofu state.... applies are not cancelled
    #   mid-run to avoid leaving partial state behind
    concurrency:
      group: tofu-gcp-${{ inputs.working_directory }}-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write      # required for workload identity federation
      pull-requests: write # required to post comments on prs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu_version }}
        # the opentofu command wrapper (enabled by default) is what exposes
        #   `steps.plan.outputs.exitcode` and `steps.show.outputs.stdout`....
        #   do not disable it
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.gcp_wif_provider }}
          service_account: ${{ inputs.gcp_service_account }}

      # INIT
      # failure comments are generic, so there is no captured log to embed...
      # ...the plain command's own exit code is what the step reports
      # init has no continue-on-error, so a failure reddens the job by itself;
      # the comment step below still runs via !cancelled() to report it
      - name: Tofu Init
        id: init
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [[ -n "${{ inputs.gcp_state_prefix }}" ]]; then
            tofu init -input=false \
              -backend-config="bucket=${{ inputs.gcp_state_bucket_name }}" \
              -backend-config="prefix=${{ inputs.gcp_state_prefix }}" \
              -upgrade
          else
            tofu init -input=false \
              -backend-config="bucket=${{ inputs.gcp_state_bucket_name }}" \
              -upgrade
          fi

      - name: Construct tfvars Argument
        id: tfvars
        run: |
          if [[ -n "${{ inputs.tfvars_file }}" ]]; then
            echo "arg=-var-file=${{ inputs.tfvars_file }}" >> $GITHUB_OUTPUT
          else
            echo "arg=" >> $GITHUB_OUTPUT
          fi

      # PLAN (pull requests only)

      # -detailed-exitcode makes the plan's exit code meaningful:
      #   0 = success, no changes | 1 = error | 2 = success, changes pending
      #   because exit code 2 is non-zero, continue-on-error keeps the job alive
      #   and `steps.plan.outcome` reads 'failure' for the normal changes case....
      #   the comment step keys off `steps.plan.outputs.exitcode`; only the
      #   fail-closed guard below uses `outcome`
      - name: Tofu Plan
        id: plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: tofu plan ${{ steps.tfvars.outputs.arg }} -input=false -no-color -detailed-exitcode -out=plan.tfplan
        continue-on-error: true

      # render the saved plan only when there are changes to show (exit code 2)
      - name: Tofu Show
        id: show
        if: github.event_name == 'pull_request' && steps.plan.outputs.exitcode == '2'
        working-directory: ${{ inputs.working_directory }}
        run: tofu show -no-color plan.tfplan

      # POST RESULT TO PR
      - name: Post Tofu Result to PR
        uses: actions/github-script@v7
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          (steps.init.outcome == 'failure' ||
           steps.plan.outputs.exitcode == '0' ||
           steps.plan.outputs.exitcode == '1' ||
           steps.plan.outputs.exitcode == '2')
        env:
          INIT_OUTCOME: ${{ steps.init.outcome }}
          PLAN_EXITCODE: ${{ steps.plan.outputs.exitcode }}
          PLAN: ${{ steps.show.outputs.stdout }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const footer = `*Pushed by: @${process.env.ACTOR}, Action: \`${process.env.EVENT_NAME}\`*`;
            const initOutcome = process.env.INIT_OUTCOME;
            const exitCode = process.env.PLAN_EXITCODE;

            let body;
            if (initOutcome === 'failure') {
              body = [
                '#### OpenTofu Init Failed ❌',
                '',
                '`tofu init` failed to initialize the working directory. Common causes:',
                '- Backend configuration is incorrect',
                '- Authentication credentials are invalid or expired',
                '- The state bucket is unreachable',
                '',
                '**Check the workflow logs for the specific error.**',
                '',
                footer,
              ].join('\n');
            } else if (exitCode === '1') {
              body = [
                '#### OpenTofu Plan Failed ❌',
                '',
                'The `tofu plan` command failed. This usually means a configuration',
                'error in the Terraform/OpenTofu files.',
                '',
                '**Check the workflow logs for the specific error message.**',
                '',
                'This must be resolved before the PR can be merged.',
                '',
                footer,
              ].join('\n');
            } else if (exitCode === '2') {
              let plan = process.env.PLAN || '';

              // the one-line verdict sits at the end of tofu show output
              // pinned into the header so it survives truncation and the
              // reviewer sees it first... destroys get a louder header
              const summaryMatch = plan.match(/^Plan: \d+ to add, \d+ to change, \d+ to destroy\.$/m);
              const summary = summaryMatch ? summaryMatch[0]
                : (/^Changes to Outputs:/m.test(plan) ? 'Output-only changes.' : 'Changes pending.');
              const destroys = summaryMatch
                ? parseInt(summaryMatch[0].match(/(\d+) to destroy/)[1], 10)
                : 0;
              const header = destroys > 0
                ? `#### OpenTofu Plan ⚠️ — ${summary}`
                : `#### OpenTofu Plan 📖 — ${summary}`;

              // truncate the MIDDLE, not the tail: the head lists the first
              //   resources, the tail holds the summary... the middle matters least
              const maxLength = 60000;
              let truncated = false;
              if (plan.length > maxLength) {
                const half = Math.floor(maxLength / 2);
                plan = plan.slice(0, half)
                  + '\n\n… [middle truncated — full output in workflow logs] …\n\n'
                  + plan.slice(-half);
                truncated = true;
              }
              const lines = [
                header,
                '<details><summary>Show Plan</summary>',
                '',
                '```terraform',
                plan,
                '```',
                '',
                '</details>',
              ];
              if (truncated) {
                lines.push('', '> ⚠️ Plan output was middle-truncated. See the full output in the workflow logs.');
              }
              lines.push('', footer);
              body = lines.join('\n');
            } else if (exitCode === '0') {
              body = [
                '#### OpenTofu Plan ✅ — No Changes',
                '',
                'No changes. Your infrastructure matches the configuration.',
                '',
                footer,
              ].join('\n');
            } else {
              return;
            }

            // post a new comment for this run
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # fail the check on a real plan error.... keyed off `outcome` (which github
      #   always sets) and only EXEMPTING changes-pending (exit code 2), so this
      #   fails CLOSED: if the setup-opentofu wrapper ever stops populating
      #   `exitcode`, a genuine error still turns the check red instead of
      #   silently passing.... exit code 2 is a successful plan and stays green
      - name: Fail Job on Plan Error
        if: >-
          github.event_name == 'pull_request' &&
          steps.plan.outcome == 'failure' &&
          steps.plan.outputs.exitcode != '2'
        run: |
          echo "::error::Tofu plan failed. Check the plan step output above for details."
          exit 1

      # APPLY (push or manual dispatch, default branch only)

      # two gates, both required:
      #   1. allow_apply: the caller's written opt-in (default false)
      #   2. default branch: run workflow can be dispatched from any branch in
      #      the actions ui.. without this gate, a side branch's unreviewed,
      #      never-planned tofu could be applied straight to the project
      - name: Tofu Apply
        id: apply
        if: >-
          inputs.allow_apply == true &&
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        working-directory: ${{ inputs.working_directory }}
        run: tofu apply ${{ steps.tfvars.outputs.arg }} -input=false -auto-approve -no-color

      # JOB SUMMARY
      - name: Write Job Summary
        if: always()
        run: |
          {
            echo "## OpenTofu Run — \`${{ inputs.working_directory }}\` (${{ github.event_name }})"
            echo ""
            echo "| Stage | Outcome | Exit code |"
            echo "|---|---|---|"
            echo "| Init | ${{ steps.init.outcome || 'n/a' }} | — |"
            echo "| Plan (PR) | ${{ steps.plan.outcome || 'n/a' }} | ${{ steps.plan.outputs.exitcode || '—' }} |"
            echo "| Apply | ${{ steps.apply.outcome || 'n/a' }} | — |"
            echo ""
            echo "_Plan exit codes: 0 = no changes, 1 = error, 2 = changes pending (reported as outcome 'failure' by design — see the plan step comments)._"
          } >> "$GITHUB_STEP_SUMMARY"
