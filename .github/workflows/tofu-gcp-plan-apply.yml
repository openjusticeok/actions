name: 'Tofu Plan & Apply for GCP'

on:
  workflow_call:
    inputs:
      gcp_project_id:
        description: 'The GCP project ID.'
        required: true
        type: string
      gcp_wif_provider:
        description: 'The full resource name of the WIF provider for Github Actions.'
        required: true
        type: string
      gcp_service_account:
        description: 'The service account email for the Github Actions workflow to use.'
        required: true
        type: string
      gcp_state_bucket_name:
        description: 'The name of the GCS bucket for Tofu state.'
        required: true
        type: string
      gcp_state_prefix:
        description: 'Optional prefix (folder) in the GCS bucket for Tofu state.'
        required: false
        type: string
        default: ''
      working_directory:
        description: 'The directory where the Tofu commands will be run.'
        required: true
        type: string
      tfvars_file:
        description: 'Optional name of the .tfvars file to use.'
        required: false
        type: string
        default: ''
      allow_apply:
        description: 'Set to true to allow the apply step to run.'
        required: true
        type: boolean
 
jobs:
  tofu:
    name: 'Tofu Plan & Apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for Workload Identity Federation
      pull-requests: write # Required to post comments on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ inputs.gcp_project_id }}
          workload_identity_provider: ${{ inputs.gcp_wif_provider }}
          service_account: ${{ inputs.gcp_service_account }}

      - name: Tofu Init
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [[ -n "${{ inputs.gcp_state_prefix }}" ]]; then
            tofu init \
              -backend-config="bucket=${{ inputs.gcp_state_bucket_name }}" \
              -backend-config="prefix=${{ inputs.gcp_state_prefix }}" \
              -upgrade
          else
            tofu init \
              -backend-config="bucket=${{ inputs.gcp_state_bucket_name }}" \
              -upgrade
          fi

      - name: Construct tfvars Argument
        id: tfvars
        run: |
          if [[ -n "${{ inputs.tfvars_file }}" ]]; then
            echo "arg=-var-file=${{ inputs.tfvars_file }}" >> $GITHUB_OUTPUT
          else
            echo "arg=" >> $GITHUB_OUTPUT
          fi

      # This step only runs on pull requests. It generates a plan and saves it to a file.
      - name: Tofu Plan
        id: plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: tofu plan ${{ steps.tfvars.outputs.arg }} -no-color -out=plan.tfplan
        # Continue even if the plan has changes, which would otherwise cause an exit code 2
        continue-on-error: true

      # This step takes the plan file and formats it for the comment.
      - name: Tofu Show
        id: show
        if: steps.plan.outcome == 'success' && github.event_name == 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: tofu show -no-color plan.tfplan

      # This step uses the output from the 'show' step to create a comment on the PR.
      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: steps.plan.outcome == 'success' && github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.show.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### OpenTofu Plan 📖
            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # This step checks the exit code of the plan to see if there are changes.
      - name: Check Plan Exit Code
        if: steps.plan.outcome == 'success' && github.event_name == 'pull_request'
        run: exit ${{ steps.plan.exit-code }}

      # This step runs on a push to main OR a manual dispatch.
      - name: Tofu Apply
        if: inputs.allow_apply == true && github.event_name != 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: tofu apply ${{ steps.tfvars.outputs.arg }} -auto-approve -no-color

